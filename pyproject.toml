[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsecare-ehr"
version = "2.4.0"
description = "Enterprise Healthcare Management & EHR Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.23",
    "passlib[bcrypt]>=1.7.4",
    "python-jose>=3.3.0",
    "cryptography>=41.0.5"
]

[project.scripts]
pulsecare = "manage:main"
pulsecare-server = "main:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
